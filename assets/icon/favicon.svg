<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#047857" flood-opacity="0.30" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" />
  
  <!-- Sleek Rectangular Credit Card (1.59:1 Aspect Ratio) -->
  <rect x="81" y="146" width="350" height="220" rx="28" ry="28" fill="url(#cardGrad)" filter="url(#shadow)" />
  
  <!-- EMV Gold Chip -->
  <rect x="117" y="196" width="64" height="48" rx="10" fill="url(#chipGrad)" />
  <line x1="117" y1="220" x2="181" y2="220" stroke="#92400E" stroke-width="2" opacity="0.6" />
  <line x1="149" y1="196" x2="149" y2="244" stroke="#92400E" stroke-width="2" opacity="0.6" />
  
  <!-- Contactless NFC waves -->
  <path d="M 205 208 A 16 16 0 0 1 205 232" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65" />
  <path d="M 216 200 A 26 26 0 0 1 216 240" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65" />
  
  <!-- Top Right Holographic Circles -->
  <circle cx="366" cy="188" r="20" fill="#ffffff" opacity="0.25" />
  <circle cx="388" cy="188" r="20" fill="#ffffff" opacity="0.18" />
  
  <!-- Embossed Card Details -->
  <circle cx="125" cy="316" r="4.5" fill="#ffffff" opacity="0.45" />
  <circle cx="139" cy="316" r="4.5" fill="#ffffff" opacity="0.45" />
  <circle cx="153" cy="316" r="4.5" fill="#ffffff" opacity="0.45" />
  <circle cx="167" cy="316" r="4.5" fill="#ffffff" opacity="0.45" />
  
  <text x="395" y="324" font-family="system-ui, -apple-system, monospace" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="end" letter-spacing="1">•••• 8829</text>
</svg>
